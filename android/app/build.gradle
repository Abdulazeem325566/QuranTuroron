plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.muslimkids.app"
    compileSdk = 35
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11.toString()
    }

    defaultConfig {
        applicationId = "com.muslimkids.app"
        // google_mobile_ads 5.x needs minSdk 23
        minSdk = 23
        targetSdk = 35
        versionCode = 1
        versionName = "1.0.0"
    }

    buildTypes {
        release {
            // NOTE: CI pehli build debug-signing se karega taake build green ho.
            // Play Store par upload se pehle apne upload-keystore se sign karein
            // (README mein tareeqa hai) aur yahan signingConfig badal dein.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
