# GitHub Actions: 
name: Build Release AAP

on:
  push:
    branches: [main]
    paths:
      - 'muslim-kids-app/**'
      - '.github/workflows/build_aab.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: muslim-kids-app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: muslim-kids-aap
          path: muslim-kids-app/build/app/outputs/bundle/release/app-release.aab
