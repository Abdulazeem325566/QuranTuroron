# GitHub Actions: har push par release AAB banata hai.
# Koi laptop/Flutter install ki zaroorat nahi — cloud mein build hota hai.
name: Build Release AAB

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      # NOTE: Pehli CI build debug-signing se hogi (app/build.gradle mein set hai)
      # taake build green ho. Play Store par upload se PEHLE apna upload-keystore
      # banayein (README dekhein) aur signingConfig badal dein.
      - run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: muslim-kids-aab
          path: build/app/outputs/bundle/release/app-release.aab
